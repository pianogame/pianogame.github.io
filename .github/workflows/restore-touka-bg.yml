name: Restore Touka profile background

on:
  push:
    branches:
      - staging
    paths:
      - ".github/workflows/restore-touka-bg.yml"

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Download verified Touka background
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/bf4e6d2287ec837efa3a85caf7f4eee8f58d8293b68535681e6cc03d4e11e3b6.jpg" \
            --output site/characters/character01/profile-bg.jpg

          python3 - <<'PY'
          from pathlib import Path
          p = Path("site/characters/character01/profile-bg.jpg")
          b = p.read_bytes()
          if len(b) != 201181:
              raise SystemExit(f"unexpected size: {len(b)}")
          if not (b.startswith(b"\xff\xd8") and b.endswith(b"\xff\xd9")):
              raise SystemExit("invalid JPEG markers")
          print("Touka background verified:", len(b), "bytes")
          PY

      - name: Commit restored background and remove helper workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-touka-bg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/characters/character01/profile-bg.jpg .github/workflows/restore-touka-bg.yml
          git commit -m "fix: restore Touka cosmic profile background"
          git push origin HEAD:staging
