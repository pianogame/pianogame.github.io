name: Publish piano

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare piano and audio
        run: python3 scripts/build_pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: piano-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for legacy Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs?head_sha={os.environ['GITHUB_SHA']}&per_page=100"
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"}
          for attempt in range(24):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  runs = json.load(response)["workflow_runs"]
              legacy = [r for r in runs if r["event"] == "dynamic" and r["name"] == "pages build and deployment" and r["head_sha"] == os.environ["GITHUB_SHA"]]
              if legacy and all(r["status"] == "completed" for r in legacy):
                  print("Legacy publication finished; publishing Piano Palette last.")
                  break
              if not legacy and attempt >= 4:
                  print("No legacy publication found.")
                  break
              time.sleep(15)
          else:
              raise SystemExit("Legacy publication is still running; refusing a racing deployment.")
          PY
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: piano-pages-${{ github.run_id }}-${{ github.run_attempt }}
