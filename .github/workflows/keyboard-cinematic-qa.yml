name: Keyboard cinematic asset QA
on:
  push:
    branches: [staging]
    paths:
      - "site/keyboard-test/tools/qa_cinematic.py"
      - ".github/workflows/keyboard-cinematic-qa.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python site/keyboard-test/tools/qa_cinematic.py
      - name: Publish visual reference only to staging
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/keyboard-test/_debug_reference.b64
          git diff --cached --quiet || (git commit -m "staging: gacha video storyboard inspection" && git push origin HEAD:staging)
