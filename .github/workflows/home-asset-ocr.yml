name: Inspect unresolved HOME assets
on:
  push:
    branches: [staging]
    paths:
      - ".github/workflows/home-asset-ocr.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - name: Emit thumbnails
        run: |
          python - <<'PY'
          from PIL import Image
          import base64, io, os
          names=[
            "4B960D6D-B576-48E8-BC69-DD4CEBF5142A.png",
            "5A4FDA6D-D683-4D5E-8DDB-9C6487DEEB40.png",
            "7473C359-B10D-446A-856D-D51929FD388B.png",
          ]
          for n in names:
              p="site/assets/home/ui/"+n
              im=Image.open(p).convert("RGBA")
              bg=Image.new("RGB",im.size,(220,220,220))
              bg.paste(im,mask=im.getchannel("A"))
              bg.thumbnail((160,160))
              buf=io.BytesIO()
              bg.save(buf,format="JPEG",quality=55,optimize=True)
              print("THUMB "+n+" "+base64.b64encode(buf.getvalue()).decode())
          PY
