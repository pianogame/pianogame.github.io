<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241324">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
  <title>メンテナンス中｜ピアノドリームステージ</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#160f18;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px;overflow:hidden}
    body:before,body:after{content:"";position:fixed;top:0;bottom:0;width:30vw;max-width:360px;background:linear-gradient(90deg,#351428,#6b214b 35%,#8a2b5c 55%,#3b132d);box-shadow:inset -18px 0 30px #14071188;z-index:0}
    body:before{left:0;border-right:2px solid #c89b58}
    body:after{right:0;transform:scaleX(-1);border-right:2px solid #c89b58}
    main{position:relative;z-index:1;width:min(620px,100%);padding:34px 28px;text-align:center;border:1px solid #d7b36c88;border-radius:22px;background:linear-gradient(160deg,#2a1b2adf,#181018f2);box-shadow:0 20px 60px #0009,0 0 35px #d6a85c18}
    .mark{font-size:42px;line-height:1;margin-bottom:14px}
    h1{margin:0;font-size:clamp(25px,6vw,38px);letter-spacing:.04em}
    .sub{margin:7px 0 24px;color:#d6b976;font-size:13px;letter-spacing:.12em}
    p{margin:0;line-height:1.9;font-size:15px;color:#f3edf2}
    .small{margin-top:18px;font-size:12px;color:#bdaeba}
  </style>
</head>
<body>
  <main>
    <div class="mark">♪</div>
    <h1>ただいまメンテナンス中です</h1>
    <div class="sub">PIANO DREAM STAGE</div>
    <p>アップデート作業を行っています。<br>公開再開まで、しばらくお待ちください。</p>
    <div class="small">ピアノドリームステージ</div>
  </main>
</body>
</html>
