<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ドリステ｜写真一致の独立可動鍵盤・staging</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(155deg,#080a14,#141326 70%,#070b12);color:#ffeed3;min-height:100%;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) max(9px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(9px,env(safe-area-inset-left))}
main{max-width:1240px;margin:0 auto;padding:12px 0 20px}
header{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:5px 3px 12px}
.eyebrow{font:600 clamp(9px,1.7vw,12px) Georgia,serif;letter-spacing:.19em;color:#cbb183}
h1{margin:6px 0 0;font-size:clamp(16px,3vw,23px)}
.counter{font-size:12px;text-align:right;white-space:nowrap;color:#c7bba8}
.counter strong{font-size:clamp(22px,5vw,31px);color:#ffe3a1;font-variant-numeric:tabular-nums}
.scene{width:100%;position:relative;aspect-ratio:1672/941;overflow:hidden;border:1px solid #c3a0655e;border-radius:12px;background:#080a15;isolation:isolate}
.scene .photo,.scene canvas{position:absolute;display:block;inset:0;width:100%;height:100%}
.photo{object-fit:fill;pointer-events:none}
.scene canvas{z-index:4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.report{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:12px 4px 0}
.report strong{font-size:18px;color:#ffe2a8}
.chip{padding:7px 12px;color:#eddaae;border:1px solid #8c714b;border-radius:20px;background:#1a1825;font-size:11px}
.detail{padding:3px 4px 0;color:#b9b5ab;font-size:12px;line-height:1.8}
@media(max-width:560px){main{padding-top:6px}header{padding-bottom:7px}.scene{border-radius:9px}.detail{font-size:11px}.report{padding-top:8px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">PIANO DREAM STAGE · STAGING TEST</div><h1>独立パーツ鍵盤 押下テスト</h1></div><div class="counter">タップ<br><strong id="tap-count">0</strong> 回</div></header>
<section class="scene" id="scene" aria-label="高画質写真の右側の鍵盤をタッチして押下を確認">
<img class="photo" id="photo" src="./highres-grand-piano.avif" width="1672" height="941" decoding="async" fetchpriority="high" alt="高画質グランドピアノ（読み込み中の予備画像）">
<canvas id="key-canvas" width="1672" height="941" aria-label="写真の右側の白鍵と黒鍵をタッチ"></canvas>
</section>
<div class="report"><div>最後の鍵盤：<strong id="last-key">—</strong></div><div>押下中：<strong id="held">0</strong></div><div class="chip" id="status">鍵盤素材を読み込み中</div></div>
<p class="detail">今回は以前切り出した白鍵18個・黒鍵13個の実画像パーツを使用。右側の31鍵を個別にタッチできるよ。通常時は元の写真を表示し、押した鍵盤だけ、既存の個別パーツから抽出した沈み込みの影を部分的に重ねる方式（矩形の画像貼り付けなし）。写真左側の鍵盤はまだ固定表示。ガチャ本体・本番には未反映。</p>
</main>
<script>
(()=>{'use strict';
const scene=document.getElementById('scene');
const canvas=document.getElementById('key-canvas'),ctx=canvas.getContext('2d',{alpha:true});
const status=document.getElementById('status'),photo=document.getElementById('photo');
const counter=document.getElementById('tap-count'),last=document.getElementById('last-key'),held=document.getElementById('held');
const parts=[{"id":"white_01","type":"white","hit":[[703,499],[728,505],[728,596],[703,589]],"x":695,"y":491,"w":41,"h":114,"up":[0,0,41,114],"down":[41,0,41,114]},{"id":"white_02","type":"white","hit":[[728,505],[767,515],[767,607],[728,596]],"x":720,"y":497,"w":55,"h":119,"up":[82,0,55,119],"down":[137,0,55,119]},{"id":"white_03","type":"white","hit":[[767,515],[802,523],[802,617],[767,607]],"x":759,"y":507,"w":51,"h":119,"up":[192,0,51,119],"down":[243,0,51,119]},{"id":"white_04","type":"white","hit":[[802,523],[835,531],[835,626],[802,617]],"x":794,"y":515,"w":49,"h":120,"up":[294,0,49,120],"down":[343,0,49,120]},{"id":"white_05","type":"white","hit":[[835,531],[870,540],[870,636],[835,626]],"x":827,"y":523,"w":51,"h":122,"up":[392,0,51,122],"down":[443,0,51,122]},{"id":"white_06","type":"white","hit":[[870,540],[907,549],[907,647],[870,636]],"x":862,"y":532,"w":53,"h":124,"up":[494,0,53,124],"down":[547,0,53,124]},{"id":"white_07","type":"white","hit":[[907,549],[950,560],[950,659],[907,647]],"x":899,"y":541,"w":59,"h":127,"up":[600,0,59,127],"down":[659,0,59,127]},{"id":"white_08","type":"white","hit":[[950,560],[991,570],[991,671],[950,659]],"x":942,"y":552,"w":57,"h":128,"up":[718,0,57,128],"down":[775,0,57,128]},{"id":"white_09","type":"white","hit":[[991,570],[1034,580],[1034,683],[991,671]],"x":983,"y":562,"w":59,"h":130,"up":[832,0,59,130],"down":[891,0,59,130]},{"id":"white_10","type":"white","hit":[[1034,580],[1076,591],[1076,695],[1034,683]],"x":1026,"y":572,"w":58,"h":132,"up":[950,0,58,132],"down":[1008,0,58,132]},{"id":"white_11","type":"white","hit":[[1076,591],[1123,602],[1123,709],[1076,695]],"x":1068,"y":583,"w":63,"h":135,"up":[1066,0,63,135],"down":[1129,0,63,135]},{"id":"white_12","type":"white","hit":[[1123,602],[1177,616],[1177,724],[1123,709]],"x":1115,"y":594,"w":70,"h":139,"up":[1192,0,70,139],"down":[1262,0,70,139]},{"id":"white_13","type":"white","hit":[[1177,616],[1236,630],[1236,741],[1177,724]],"x":1169,"y":610,"w":75,"h":140,"up":[1332,0,75,140],"down":[1407,0,75,140]},{"id":"white_14","type":"white","hit":[[1236,630],[1304,647],[1304,760],[1236,741]],"x":1228,"y":622,"w":84,"h":147,"up":[0,140,84,147],"down":[84,140,84,147]},{"id":"white_15","type":"white","hit":[[1304,647],[1381,666],[1381,782],[1304,760]],"x":1296,"y":639,"w":93,"h":152,"up":[168,140,93,152],"down":[261,140,93,152]},{"id":"white_16","type":"white","hit":[[1381,666],[1467,687],[1467,807],[1381,782]],"x":1373,"y":658,"w":102,"h":158,"up":[354,140,102,158],"down":[456,140,102,158]},{"id":"white_17","type":"white","hit":[[1467,687],[1561,711],[1561,833],[1467,807]],"x":1459,"y":679,"w":110,"h":163,"up":[558,140,110,163],"down":[668,140,110,163]},{"id":"white_18","type":"white","hit":[[1561,711],[1671,738],[1671,865],[1561,833]],"x":1553,"y":703,"w":127,"h":171,"up":[778,140,127,171],"down":[905,140,127,171]},{"id":"black_01","type":"black","hit":[[836,525],[853,531],[891,507],[874,500]],"x":828,"y":492,"w":72,"h":48,"up":[1032,140,72,48],"down":[1104,140,72,48]},{"id":"black_02","type":"black","hit":[[867,533],[885,539],[925,515],[906,508]],"x":859,"y":500,"w":75,"h":48,"up":[1176,140,75,48],"down":[1251,140,75,48]},{"id":"black_03","type":"black","hit":[[909,544],[928,550],[968,526],[949,519]],"x":901,"y":511,"w":76,"h":48,"up":[1326,140,76,48],"down":[1402,140,76,48]},{"id":"black_04","type":"black","hit":[[941,554],[961,560],[1002,535],[981,528]],"x":933,"y":520,"w":78,"h":49,"up":[0,311,78,49],"down":[78,311,78,49]},{"id":"black_05","type":"black","hit":[[989,563],[1010,569],[1053,544],[1031,537]],"x":981,"y":529,"w":81,"h":49,"up":[156,311,81,49],"down":[237,311,81,49]},{"id":"black_06","type":"black","hit":[[1028,574],[1050,580],[1094,555],[1071,548]],"x":1020,"y":540,"w":83,"h":49,"up":[318,311,83,49],"down":[401,311,83,49]},{"id":"black_07","type":"black","hit":[[1104,596],[1128,602],[1174,576],[1149,569]],"x":1096,"y":561,"w":87,"h":50,"up":[484,311,87,50],"down":[571,311,87,50]},{"id":"black_08","type":"black","hit":[[1169,615],[1194,621],[1241,594],[1215,587]],"x":1161,"y":579,"w":89,"h":51,"up":[658,311,89,51],"down":[747,311,89,51]},{"id":"black_09","type":"black","hit":[[1252,634],[1280,640],[1329,612],[1301,605]],"x":1244,"y":597,"w":94,"h":52,"up":[836,311,94,52],"down":[930,311,94,52]},{"id":"black_10","type":"black","hit":[[1321,651],[1351,657],[1401,629],[1371,622]],"x":1313,"y":614,"w":97,"h":52,"up":[1024,311,97,52],"down":[1121,311,97,52]},{"id":"black_11","type":"black","hit":[[1406,678],[1438,684],[1492,655],[1459,648]],"x":1398,"y":640,"w":103,"h":53,"up":[1218,311,103,53],"down":[1321,311,103,53]},{"id":"black_12","type":"black","hit":[[1514,710],[1549,716],[1605,686],[1569,679]],"x":1506,"y":671,"w":108,"h":54,"up":[1424,311,108,54],"down":[0,365,108,54]},{"id":"black_13","type":"black","hit":[[1607,737],[1645,743],[1704,712],[1665,705]],"x":1599,"y":697,"w":81,"h":55,"up":[108,365,81,55],"down":[189,365,81,55]}];
let atlas=null,ready=false,count=0,lastPointerTime=0;
let active=new Map(),released=new Map();
function showError(message){status.textContent=message;status.style.borderColor='#d67d78';}
function inside(points,x,y){
 let ok=false;
 for(let i=0,j=points.length-1;i<points.length;j=i++){
  const a=points[i],b=points[j];
  if(((a[1]>y)!=(b[1]>y)) && x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])ok=!ok;
 }
 return ok;
}
// Topmost black keys first, white keys second.
function keyAt(x,y){
 for(let i=parts.length-1;i>=0;i--)if(parts[i].type==='black'&&inside(parts[i].hit,x,y))return parts[i];
 for(let i=parts.length-1;i>=0;i--)if(parts[i].type==='white'&&inside(parts[i].hit,x,y))return parts[i];
 return null;
}
function getPoint(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*1672/r.width,(e.clientY-r.top)*941/r.height]}
// Never redraw a resting key or switch to a retouched keybed:
// doing so creates the pale rectangular seams reported on iPhone.
// Keep the source photograph pixel-perfect. The pressed and released
// key sprites are used only to calculate localized lighting changes.
// Pasting their full RGB crops created rectangular colour/reflection seams.
const sourceCanvas=document.createElement('canvas');
sourceCanvas.width=1672;sourceCanvas.height=941;
const sourceCtx=sourceCanvas.getContext('2d',{willReadFrequently:true});
const partCanvas=document.createElement('canvas');
partCanvas.width=256;partCanvas.height=256;
const partCtx=partCanvas.getContext('2d',{willReadFrequently:true});
const pressCache=new Map();
function buildPressedPatch(part){
 if(pressCache.has(part.id))return pressCache.get(part.id);
 const [ux,uy,uw,uh]=part.up,[dx,dy,dw,dh]=part.down;
 partCtx.clearRect(0,0,256,256);
 partCtx.drawImage(atlas,ux,uy,uw,uh,0,0,part.w,part.h);
 const up=partCtx.getImageData(0,0,part.w,part.h).data;
 partCtx.clearRect(0,0,256,256);
 partCtx.drawImage(atlas,dx,dy,dw,dh,0,0,part.w,part.h);
 const down=partCtx.getImageData(0,0,part.w,part.h).data;
 const photoPixels=sourceCtx.getImageData(part.x,part.y,part.w,part.h).data;
 const out=partCtx.createImageData(part.w,part.h), data=out.data;
 const w=part.w,h=part.h;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const k=(y*w+x)*4;
  if(up[k+3]<240)continue;
  // Erase border ringing and semi-transparent rectangular crop margins.
  let clean=1;
  for(let yy=Math.max(0,y-2);yy<=Math.min(h-1,y+2)&&clean;yy++){
   for(let xx=Math.max(0,x-2);xx<=Math.min(w-1,x+2);xx++){
    if(up[(yy*w+xx)*4+3]<240){clean=0;break;}
   }
  }
  if(!clean)continue;
  // The key is hinged near the back: only these two narrow strips
  // change illumination. The middle of the photographed key is untouched.
  const upper=Math.max(0,1-Math.max(0,y-8)/(Math.min(24,h*.3)));
  const lower=Math.max(0,1-Math.max(0,h-8-y)/(Math.min(25,h*.3)));
  const band=Math.max(upper*.9,lower*.85);
  const side=Math.min(1,Math.max(0,(x-7)/5),Math.max(0,(w-8-x)/5));
  const amount=band*side;
  if(amount<.015)continue;
  const shade=(part.type==='black'?7:13);
  for(let ch=0;ch<3;ch++){
   const displacement=Math.max(-32,Math.min(18,down[k+ch]-up[k+ch]));
   // Match the underlying image exactly; add only the up/down difference.
   data[k+ch]=Math.max(0,Math.min(255,photoPixels[k+ch]+displacement*.35-shade));
  }
  data[k+3]=Math.round(255*amount);
 }
 const sprite=document.createElement('canvas');
 sprite.width=w;sprite.height=h;
 sprite.getContext('2d').putImageData(out,0,0);
 pressCache.set(part.id,sprite);
 return sprite;
}
function draw(){
 if(!ready||!ctx||!atlas)return;
 ctx.clearRect(0,0,1672,941);
 for(const part of parts){
  const pressed=[...active.values()].some(key=>key.id===part.id)||released.has(part.id);
  if(!pressed)continue;
  const sprite=buildPressedPatch(part);
  ctx.drawImage(sprite,part.x,part.y);
 }
 held.textContent=String(active.size);
}
function press(key,id){
 if(!ready||!key)return;
 const before=active.get(id);if(before?.id===key.id)return;
 if(before)release(id);
 const t=released.get(key.id);if(t){clearTimeout(t);released.delete(key.id)}
 active.set(id,key);count++;counter.textContent=String(count);last.textContent=key.type==='black'?'黒鍵 '+key.id:'白鍵 '+key.id;
 status.textContent=(key.type==='black'?'黒鍵':'白鍵')+'の押下を表示';draw();
}
function release(id){
 const key=active.get(id);if(!key)return;
 active.delete(id);
 // A short tap stays pressed long enough to see on an iPhone.
 const timer=setTimeout(()=>{released.delete(key.id);draw();},200);
 const old=released.get(key.id);if(old)clearTimeout(old);
 released.set(key.id,timer);draw();
}
canvas.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 const xy=getPoint(e),key=keyAt(xy[0],xy[1]);if(!key)return;
 e.preventDefault();lastPointerTime=Date.now();press(key,e.pointerId);
 try{canvas.setPointerCapture(e.pointerId)}catch(_){ }
});
canvas.addEventListener('pointermove',e=>{
 if(!active.has(e.pointerId))return;
 const xy=getPoint(e),key=keyAt(xy[0],xy[1]);
 if(key && key.id!==active.get(e.pointerId)?.id){release(e.pointerId);press(key,e.pointerId)}
});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>release(e.pointerId));
canvas.addEventListener('click',e=>{
 if(Date.now()-lastPointerTime<650)return;
 const xy=getPoint(e),key=keyAt(xy[0],xy[1]);if(!key)return;
 press(key,'click');release('click');
});
window.addEventListener('blur',()=>{[...active.keys()].forEach(id=>release(id))});
const img=new Image();img.decoding='async';
let photoReady=false,atlasReady=false;
function checkReady(){
 if(!photoReady||!atlasReady)return;
 sourceCtx.drawImage(photo,0,0,1672,941);
 ready=true;
 status.textContent='独立パーツ31鍵・押下影 読込OK';
 draw();
}
img.onload=()=>{atlas=img;atlasReady=true;checkReady()};
img.onerror=()=>showError('鍵盤パーツの読み込みに失敗');
img.src='./key-sprites.webp';
photo.onload=()=>{photoReady=true;checkReady()};
photo.onerror=()=>showError('高画質ピアノを読み込めません');
if(photo.complete&&photo.naturalWidth>0){photoReady=true;checkReady()}
})();
</script></body></html>
