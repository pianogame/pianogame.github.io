<main><div class="top"><div><div class="eyebrow">PIANO DREAM STAGE · STAGING ONLY</div><h1>白鍵・黒鍵の立体可動テスト</h1><div class="subhead">写真の上塗りではなく、鍵盤本体が奥を支点に動く試作</div></div><div class="counter">タップ<strong id="count">0</strong></div></div>

<div class="labelrow"><b>PHYSICAL KEY TEST</b><small>中央の白鍵 ＆ 黒鍵を押して確認</small></div>
<div class="workbench"><div class="piano-chassis" aria-hidden="true"></div><div class="stage-camera"><div class="keyboard-rig"><div class="key-well"></div><div class="keygroup" id="keygroup"><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key sample" type="button" data-sample="white" aria-label="試作白鍵を押す" aria-pressed="false" ><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled><span class="surface"></span><span class="front-face"></span><span class="edge-light"></span></button><button class="white-key key " type="button" data-sample="" aria-label="動かない鍵盤" aria-pressed="false" disabled <p class="explain">今回は白鍵1個・黒鍵1個だけの<strong>立体可動構造</strong>をテストしている。鍵盤は個別の厚み・側面・支点を持ち、押すと鍵盤本体が傾いて沈み、離すと戻る。その他の鍵盤と背景写真は動かない。ガチャ本体にはまだ組み込まない。</p>
<details class="reference"><summary>元の高画質ピアノ写真を見る（参照用・固定）</summary><img src="./highres-grand-piano.avif" alt="元の大聖堂とグランドピアノの高画質写真" loading="lazy" width="1672" height="941"></details>

<script>
(()=>{
'use strict';
const samples={white:document.querySelector('.white-key.sample'),black:document.querySelector('.black-key.sample')};
const count=document.getElementById('count'),last=document.getElementById('last'),held=document.getElementById('held'),status=document.getElementById('status');
const pointers=new Map();let taps=0,lastPressTime=0;
const actives={white:new Set(),black:new Set()};
const pressedAt={white:0,black:0},pending={white:null,black:null};
function refresh(){
 for(const kind of ['white','black']){
  const down=actives[kind].size>0||pending[kind]!==null;
  samples[kind].classList.toggle('is-pressed',down);
  samples[kind].setAttribute('aria-pressed',down?'true':'false');
  document.getElementById(kind+'-test').setAttribute('aria-pressed',down?'true':'false');
 }
 held.textContent=String(['white','black'].filter(k=>actives[k].size>0).length);
}
function press(k,id){
 if(!samples[k]||actives[k].has(id))return;
 if(pending[k]!==null){clearTimeout(pending[k]);pending[k]=null;}
 actives[k].add(id);pressedAt[k]=performance.now();taps++;count.textContent=String(taps);
 last.textContent=k==='white'?'白鍵（立体）':'黒鍵（立体）';
 status.textContent='鍵盤が支点から沈み込み中';
 refresh();
}
function release(k,id){
 if(!actives[k]?.has(id))return;
 actives[k].delete(id);
 // A quick tap must complete the physical key travel before returning.
 const delay=Math.max(0,330-(performance.now()-pressedAt[k]));
 if(actives[k].size===0){
  pending[k]=setTimeout(()=>{pending[k]=null;refresh();status.textContent='鍵盤が元の高さへ復帰';},delay);
 } else {refresh();}
}
function init(el){
 const kind=el.dataset.sample;if(!kind)return;
 el.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  e.preventDefault();lastPressTime=Date.now();
  press(kind,e.pointerId);pointers.set(e.pointerId,kind);
  try{el.setPointerCapture(e.pointerId)}catch(_){}
 });
 for(const t of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(t,e=>{
  const k=pointers.get(e.pointerId);
  if(k){release(k,e.pointerId);pointers.delete(e.pointerId);}
 });
 el.addEventListener('click',e=>{
  if(Date.now()-lastPressTime<650)return;
  press(kind,'click');setTimeout(()=>release(kind,'click'),380);
 });
 el.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){if(!e.repeat){e.preventDefault();press(kind,'keyboard');}}});
 el.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();release(kind,'keyboard');}});
}
[...document.querySelectorAll('[data-sample="white"],[data-sample="black"]')].forEach(init);
window.addEventListener('blur',()=>{for(const k of ['white','black']){actives[k].clear();if(pending[k]!==null){clearTimeout(pending[k]);pending[k]=null;}}pointers.clear();refresh()});
status.textContent='白鍵・黒鍵の立体可動 準備OK';
})();
</script></body></html>
