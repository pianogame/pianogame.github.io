<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#0b0d17"><meta name="robots" content="noindex,nofollow">
<title>ドリステ｜高画質ピアノ・鍵盤可動テスト</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:linear-gradient(150deg,#070b17,#151427 64%,#080b13);color:#fff0cf;-webkit-text-size-adjust:100%;min-height:100%}
body{padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left))}
main{max-width:1240px;margin:auto;padding:14px 0 32px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:4px 6px 14px}
.eyebrow{color:#ceb382;letter-spacing:.21em;font:600 clamp(9px,1.7vw,12px) Georgia,serif}
h1{font-size:clamp(17px,3vw,23px);margin:5px 0 0;font-weight:700}
.counter{text-align:right;font-size:12px;white-space:nowrap;color:#cbbda8}
.counter b{font-size:clamp(21px,5vw,29px);color:#ffe4a4;font-variant-numeric:tabular-nums}
.scene{position:relative;width:100%;aspect-ratio:1672/941;overflow:hidden;border:1px solid #ba965c69;border-radius:14px;isolation:isolate;background:#10101b;box-shadow:0 18px 40px #0009}
.hero{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.layer{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.touchkey{fill:transparent;stroke:none;pointer-events:all;cursor:pointer;touch-action:none;outline:none;-webkit-tap-highlight-color:transparent}
.touchkey:focus-visible{stroke:#ffe08b;stroke-width:4;fill:#ffe08b15}
#press-shadow{opacity:0;pointer-events:none;transition:opacity .07s linear}
#press-image-group{opacity:0;pointer-events:none;transform-box:view-box;transform-origin:50% 0%;transition:opacity .07s ease,transform .095s cubic-bezier(.13,.72,.2,1)}
#press-edge{opacity:0;stroke:#120d15;stroke-width:4;fill:none;pointer-events:none;transition:opacity .09s ease}
.scene.is-pressing #press-shadow{opacity:1}
.scene.is-pressing #press-image-group{opacity:1}
.scene.is-pressing #press-edge{opacity:1}
.scene[data-kind="black"] #press-shadow{fill:#080510;fill-opacity:.45}
.scene[data-kind="white"] #press-shadow{fill:#30211b;fill-opacity:.38}
.scene[data-kind="black"] #press-image-group{transform:translateY(4px)}
.scene[data-kind="white"] #press-image-group{transform:translateY(7px)}
.info{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 4px 0}
.info strong{font-size:19px;color:#ffe3a2;font-variant-numeric:tabular-nums}
.chip{font-size:12px;padding:7px 13px;border:1px solid #8b6b3e;border-radius:50px;background:#211d29;color:#ead6ae}
.hint{padding:0 4px;font-size:12px;line-height:1.7;color:#bfb4a4;margin-top:12px}
@media(max-width:560px){main{padding-top:8px}header{padding-bottom:10px}.scene{border-radius:10px}.info{padding-top:10px}.hint{font-size:11px}}
@media(prefers-reduced-motion:reduce){#press-shadow,#press-image-group,#press-edge{transition:none}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">PIANO DREAM STAGE · STAGING TEST</div><h1>高画質ピアノ・可動鍵盤</h1></div><div class="counter">タップ<br><b id="tap-count">0</b> 回</div></header>
<section class="scene" id="scene" aria-label="写真の鍵盤をタッチして沈み込みを確認">
<img class="hero" id="photo" src="./highres-grand-piano.avif" width="1672" height="941" decoding="async" fetchpriority="high" alt="黄金に照らされた大聖堂と黒いグランドピアノ">
<svg id="keys-svg" class="layer" viewBox="0 0 1672 941" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-label="鍵盤のタッチ領域">
  <defs><clipPath id="pressed-key-clip" clipPathUnits="userSpaceOnUse"><polygon id="press-clip-poly" points="0,0 0,0 0,0"></polygon></clipPath></defs>
  <polygon id="press-shadow" points="0,0 0,0 0,0"/>
  <g clip-path="url(#pressed-key-clip)"><g id="press-image-group"><image href="./highres-grand-piano.avif" x="0" y="0" width="1672" height="941" preserveAspectRatio="none"/></g></g>
  <polyline id="press-edge" points="0,0 0,0 0,0"></polyline>
  <g id="white-hit"></g><g id="black-hit"></g>
</svg>
</section>
<div class="info"><div>最後に押した鍵盤：<strong id="last-key">—</strong></div><div>押下中：<strong id="held">0</strong></div><div class="chip" id="status">読み込み中</div></div>
<p class="hint">ピアノの鍵盤に直接タッチしてね。黒鍵は奥側を支点に小さく沈み、手前に倒れない調整。まずはiPhoneで高画質画像とタッチ判定を確認するためのテスト画面だよ。ガチャ本体には未反映。</p>
</main>
<script>
(()=>{
  'use strict';
  const svg=document.getElementById('keys-svg'), scene=document.getElementById('scene');
  const photo=document.getElementById('photo'),status=document.getElementById('status');
  const white=document.getElementById('white-hit'),black=document.getElementById('black-hit');
  const counter=document.getElementById('tap-count'),last=document.getElementById('last-key'),held=document.getElementById('held');
  const clip=document.getElementById('press-clip-poly'),shadow=document.getElementById('press-shadow'),edge=document.getElementById('press-edge');
  const NS='http://www.w3.org/2000/svg';
  let count=0,releaseTimer=null,active=null,lastPointer=0;
  function photoState(){status.textContent=photo.naturalWidth>0?'高画質画像 OK · '+photo.naturalWidth+'px':'画像を読み込めません';}
  photo.addEventListener('load',photoState);photo.addEventListener('error',photoState);if(photo.complete)photoState();
  // Photo-specific outlines: the keyboard rises diagonally from left to right.
  // The hit areas are bounded by the true upper/lower keybed edges, not generic rectangles.
  const xbounds=[367,384,401,419,437,455,474,495,517,541,567,595,626,662,700,734,770,807,846,887,930,975,1022,1071,1122,1175,1231,1290,1353,1420,1491,1566,1648,1730];
  const whites=['ド','レ','ミ','ファ','ソ','ラ','シ'];
  const f=n=>Number(n.toFixed(1));
  const back=x=>f(391+0.139*x);
  const front=x=>f(383+0.276*x);
  const bBack=x=>f(391+0.105*x);
  const bFront=x=>f(375+0.197*x);
  const pointString=points=>points.map(p=>f(p[0])+','+f(p[1])).join(' ');
  const makePoly=(points,note,kind)=>{
    const p=document.createElementNS(NS,'polygon');
    p.setAttribute('points',pointString(points));
    p.setAttribute('class','touchkey');
    p.setAttribute('data-note',note);p.setAttribute('data-kind',kind);
    p.setAttribute('role','button');p.setAttribute('tabindex','0');
    p.setAttribute('aria-label',note+' の'+(kind==='black'?'黒鍵':'白鍵'));
    (kind==='black'?black:white).appendChild(p);
  };
  xbounds.slice(0,-1).forEach((start,i)=>{
    const end=xbounds[i+1];
    const pts=[[start-11,back(start-11)],[end-11,back(end-11)],[end+9,front(end+9)],[start+8,front(start+8)]];
    makePoly(pts,whites[i%7]+(4+Math.floor(i/7)),'white');
  });
  xbounds.slice(0,-2).forEach((start,i)=>{
    if(i%7===2||i%7===6)return; // E–F and B–C have no black key.
    const next=xbounds[i+1];const mid=(start+next)/2;
    const width=Math.max(26,(next-start)*.84);
    const points=[[mid-width*.50,bBack(mid-width*.5)],[mid+width*.48,bBack(mid+width*.48)],
                  [mid+width*.69,bFront(mid+width*.69)],[mid-width*.40,bFront(mid-width*.4)]];
    const semis=['ド♯','レ♯','','ファ♯','ソ♯','ラ♯',''];
    makePoly(points,semis[i%7]+(4+Math.floor(i/7)),'black');
  });
  function clearPress(){
    active=null;scene.classList.remove('is-pressing');held.textContent='0';
  }
  function finishPress(){clearTimeout(releaseTimer);releaseTimer=setTimeout(clearPress,210);}
  function press(target){
    if(!target)return;
    clearTimeout(releaseTimer);
    const points=target.getAttribute('points');
    active=target;scene.dataset.kind=target.dataset.kind;
    clip.setAttribute('points',points);shadow.setAttribute('points',points);
    const verts=points.trim().split(/\s+/);
    edge.setAttribute('points',verts[0]+' '+verts[1]);
    // Force the offset image to be fully positioned before starting the press animation.
    scene.classList.add('is-pressing');
    count++;counter.textContent=String(count);
    last.textContent=target.dataset.note;
    held.textContent='1';
    status.textContent=(target.dataset.kind==='black'?'黒鍵':'白鍵')+'の押下を確認';
  }
  function targetOf(el){return el&&el.closest?el.closest('polygon.touchkey'):null;}
  svg.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    const target=targetOf(e.target);if(!target)return;
    e.preventDefault();lastPointer=Date.now();press(target);
    try{target.setPointerCapture(e.pointerId)}catch(_){}
  });
  svg.addEventListener('pointerup',e=>{if(active){e.preventDefault();finishPress();}});
  svg.addEventListener('pointercancel',()=>{if(active)finishPress();});
  svg.addEventListener('lostpointercapture',()=>{if(active)finishPress();});
  svg.addEventListener('click',e=>{if(Date.now()-lastPointer<650)return;const p=targetOf(e.target);if(p){press(p);finishPress();}});
  svg.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){const p=targetOf(e.target);if(p){e.preventDefault();press(p);}}});
  svg.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter'){if(active){e.preventDefault();finishPress();}}});
  window.addEventListener('blur',clearPress);
})();
</script>
</body>
</html>
