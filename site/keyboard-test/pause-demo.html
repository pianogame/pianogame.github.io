<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -8%,#252039,#080911 74%);color:#f9efd8}

@media(prefers-reduced-motion:reduce){.touch-prompt .word{animation:none}}
.info{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:14px 2px 7px;color:#d0bfa3;font-size:12px}
.info strong{color:#ffe5ac}

.note{font-size:12px;line-height:1.75;color:#c3b69f;max-width:760px}

const WAIT_AT=1.53,FREEZE_AT=1.78,CARD_AT=4.10;
let mode='loading',touches=0,frameId=null,runToken=0;
function showPrompt(on){prompt.setAttribute('aria-hidden',on?'false':'true');prompt.tabIndex=on?0:-1}
function state(next,label){mode=next;stage.dataset.phase=next;status.textContent=label}
function stopWatching(){if(frameId!==null&&video.cancelVideoFrameCallback)video.cancelVideoFrameCallback(frameId);frameId=null}
function hold(){if(mode!=='intro')return;video.pause();stopWatching();
 // These two timestamps belong to identical still frames in the SAME video.
 if(Math.abs(video.currentTime-FREEZE_AT)>.025)video.currentTime=FREEZE_AT;
 state('waiting','タッチ待機中');showPrompt(true)
}
function observe(now,data){frameId=null;const t=data?.mediaTime??video.currentTime;
 if(mode==='intro'&&t>=WAIT_AT){hold();return}
 if(mode==='playing'&&t>=CARD_AT)state('card','カード登場中');
 if(mode==='intro'||mode==='playing')watch()
}
function watch(){if(typeof video.requestVideoFrameCallback==='function')frameId=video.requestVideoFrameCallback(observe)}
async function begin(){const token=++runToken;stopWatching();video.pause();showPrompt(false);video.currentTime=0;
 state('intro','タッチ前に鍵盤へ接近');
 try{await video.play();if(runToken!==token)return;watch()}
 catch(e){if(runToken!==token)return;state('ready','タッチで再生開始');showPrompt(true)}
}
function proceed(){if(mode==='ready'){begin();return}if(mode!=='waiting')return;
 touches++;tapcount.textContent=String(touches);showPrompt(false);
 state('playing','鍵盤が沈む → 復帰 → ズームアウト');
 if(Math.abs(video.currentTime-FREEZE_AT)>.04)video.currentTime=FREEZE_AT;
 video.play().then(watch).catch(()=>{state('waiting','もう一度タッチ');showPrompt(true)})
}
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;proceed()});
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();proceed()}});
restart.addEventListener('click',begin);
video.addEventListener('loadeddata',()=>{if(mode==='loading')begin()});
video.addEventListener('timeupdate',()=>{clock.textContent=video.currentTime.toFixed(2)+'秒';if(mode==='intro'&&video.currentTime>=WAIT_AT)hold();if(mode==='playing'&&video.currentTime>=CARD_AT)state('card','カード登場中')});
video.addEventListener('ended',()=>{stopWatching();showPrompt(false);state('ended','カード演出終了')});
video.addEventListener('error',()=>{stopWatching();showPrompt(false);state('error','映像の読み込みに失敗')});
// When returning to the page, a suspended video must never jump ahead to the reveal.
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(mode==='intro'||mode==='playing')){video.pause();stopWatching();state('suspended','再生を一時停止中')}else if(!document.hidden&&mode==='suspended'){state('ready','タッチで最初から再生');showPrompt(true)}});
if(video.readyState>=2)begin();else video.load();
})();
</script>
</body></html>
