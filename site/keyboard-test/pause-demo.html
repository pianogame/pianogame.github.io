<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090c"><meta name="robots" content="noindex,nofollow">
<title>ドリステ｜動画停止・タッチ再開 機構テスト</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 52% -8%,#27202e,#09080d 72%);color:#f5e9cc}
main{max-width:1170px;margin:auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:flex;justify-content:space-between;align-items:end;gap:12px;padding:11px 1px 19px}
.eyebrow{font:600 10px Georgia,serif;letter-spacing:.18em;color:#c7ad84}
h1{font-size:clamp(17px,4vw,25px);line-height:1.3;margin:6px 0 0;font-weight:700}
header small{font-size:11px;color:#bda98c;text-align:right;white-space:nowrap}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:10px;background:#110d0f;border:1px solid #8e6f46b0;box-shadow:0 26px 58px #000b;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 46px #09040880}
video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.prompt{position:absolute;z-index:5;inset:0;display:none;align-items:center;justify-content:flex-start;flex-direction:column;gap:4px;padding-top:11.8%;text-align:center;cursor:pointer;background:none;-webkit-tap-highlight-color:transparent}
.prompt[aria-hidden="false"]{display:flex}
.prompt .word{padding:0;border:0;background:none;box-shadow:none;color:#fff5df;text-shadow:0 1px 8px #000c,0 0 14px #edbe79aa;font-weight:500;font-size:clamp(14px,2.1vw,23px);letter-spacing:.25em;line-height:1.5;pointer-events:none;animation:prompt-breathe 2.35s ease-in-out infinite}
.prompt small{font:10px Georgia,serif;letter-spacing:.22em;color:#e4c99e;text-shadow:0 1px 7px #000e;opacity:.82;pointer-events:none}
@keyframes prompt-breathe{0%,100%{opacity:.8;transform:translateY(1px)}50%{opacity:1;transform:translateY(-2px)}}
@media(prefers-reduced-motion:reduce){.prompt .word{animation:none}}
.status{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;padding:15px 3px 5px;color:#d5bd9a}
.status b{color:#f6db9e;font-weight:700}
.controls{display:flex;gap:9px;flex-wrap:wrap;padding:10px 0}
button{font-size:13px;color:#f8e9ce;background:#24202a;border:1px solid #937746;padding:10px 18px;border-radius:8px;cursor:pointer}
button:active{transform:translateY(1px)}
.note{font-size:12px;line-height:1.85;color:#b7a995;margin:10px 0;max-width:760px}
@media(max-width:560px){header{padding-bottom:12px}.stage{border-radius:6px}.prompt .word{font-size:clamp(12px,3.7vw,16px);letter-spacing:.19em}.prompt small{font-size:8px;letter-spacing:.15em}.status{font-size:11px}}
</style>
</head>
<body><main><header><div><div class="eyebrow">PIANO DREAM STAGE · STAGING / MOTION TEST</div><h1>ガチャ動画｜一時停止→タッチ→続き再生</h1></div><small>技術検証専用・本番未反映</small></header>
<section id="stage" class="stage" aria-label="動画のタッチ再生テスト">
  <video id="movie" src="./piano-pause-press-prototype.mp4" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  <div id="prompt" class="prompt" role="button" aria-label="タッチしてガチャ演出を進める" aria-hidden="true" tabindex="-1"><div class="word">画面をタッチ</div><small>TOUCH TO PLAY</small></div>
</section>
<div class="status"><span>状態：<b id="status">準備中</b></span><span>タッチ回数：<b id="count">0</b></span><span>動画：<b id="time">0.00秒</b></span></div>
<div class="controls"><button id="restart" type="button">最初からもう一度</button></div>
<p class="note">これは「1本の映像を途中で停止して待機し、画面タッチで同じ映像を再開できるか」の技術検証です。現在の鍵盤押下シーンは静止画から生成した仮アニメーションであり、完成演出ではありません。ガチャ抽選、カード演出、音声は未接続です。</p>
</main>
<script>
(()=>{'use strict';
const video=document.getElementById('movie');
const stage=document.getElementById('stage');
const prompt=document.getElementById('prompt');
const status=document.getElementById('status');
const count=document.getElementById('count');
const time=document.getElementById('time');
const restart=document.getElementById('restart');
const WAIT_AT=1.53, RESUME_AT=1.68;
let state='loading',runs=0,taps=0,frameRequest=null;
function showPrompt(show){prompt.setAttribute('aria-hidden',show?'false':'true');prompt.tabIndex=show?0:-1;}
function setState(s,message){state=s;status.textContent=message;stage.dataset.state=s;}
function cancelFrames(){if(frameRequest!==null&&typeof video.cancelVideoFrameCallback==='function')video.cancelVideoFrameCallback(frameRequest);frameRequest=null;}
function frameLoop(now,metadata){
 frameRequest=null;
 if(state==='intro' && (metadata?.mediaTime??video.currentTime)>=WAIT_AT){
  video.pause();cancelFrames();
  // Seek only within a segment whose every frame is visually identical.
  // This keeps the paused frame and continuation perfectly matched.
  if(Math.abs(video.currentTime-RESUME_AT)>.035)video.currentTime=RESUME_AT;
  setState('waiting','タッチ待機（時間制限なし）');showPrompt(true);return;
 }
 if(state==='intro')watchFrame();
}
function watchFrame(){
 if(typeof video.requestVideoFrameCallback==='function')frameRequest=video.requestVideoFrameCallback(frameLoop);
}
async function begin(){
 cancelFrames();video.pause();showPrompt(false);video.currentTime=0;
 setState('intro','ピアノ登場映像 再生中');runs++;
 try{await video.play();watchFrame()}catch(err){setState('ready','再生を開始するには画面をタッチ');showPrompt(true);}
}
function resume(){
 if(state==='ready'){begin();return}
 if(state!=='waiting')return;
 taps++;count.textContent=String(taps);showPrompt(false);
 setState('playing','鍵盤押下映像 再生中');
 // The still pause point is exact and the video is already buffered.
 if(video.currentTime<WAIT_AT-.05||video.currentTime>1.76)video.currentTime=RESUME_AT;
 video.play().catch(()=>{setState('waiting','再生を再試行して');showPrompt(true)});
}
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;resume()});
prompt.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();resume()}});
restart.addEventListener('click',()=>{begin()});
video.addEventListener('loadeddata',()=>{if(state==='loading')begin()});
video.addEventListener('timeupdate',()=>{
 time.textContent=video.currentTime.toFixed(2)+'秒';
 if(state==='intro'&&video.currentTime>=WAIT_AT)frameLoop(null,{mediaTime:video.currentTime});
});
video.addEventListener('ended',()=>{cancelFrames();setState('ended','再生完了（カード演出へ接続予定）');showPrompt(false)});
video.addEventListener('error',()=>{setState('error','動画の読み込みに失敗');showPrompt(false)});
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){if(state==='intro'||state==='playing'){video.pause();setState('paused','画面復帰待ち');showPrompt(true)}}
});
// If the tab was backgrounded during intro, restart on next tap;
// otherwise continue the already loaded video from where it paused.
stage.addEventListener('pointerup',()=>{if(state!=='paused')return;if(video.currentTime<WAIT_AT)begin();else {setState('playing','再生再開中');showPrompt(false);video.play().catch(()=>{})}});
if(video.readyState>=2)begin();else{video.load();setState('loading','動画読み込み中')}
})();
</script></body></html>
