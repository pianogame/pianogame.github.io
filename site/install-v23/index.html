<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241324">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ピアノドリームステージ">
  <meta name="mobile-web-app-capable" content="yes">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>ピアノドリームステージ</title>
  <link rel="icon" type="image/png" href="https://piano-dream-stage.vercel.app/install-v23/piano-dream-stage-touch-v23.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://piano-dream-stage.vercel.app/install-v23/piano-dream-stage-touch-v23.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://piano-dream-stage.vercel.app/install-v23/piano-dream-stage-touch-v23.png">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Maru Gothic ProN",sans-serif;background:
      radial-gradient(circle at 50% -5%,rgba(255,121,224,.45),transparent 32%),
      radial-gradient(circle at 18% 28%,rgba(104,71,255,.4),transparent 28%),
      radial-gradient(circle at 86% 78%,rgba(255,190,94,.2),transparent 26%),
      linear-gradient(155deg,#120722 0%,#2b0b47 42%,#4b1261 66%,#16091f 100%);color:#fff}
    body{display:grid;place-items:center;min-height:100dvh;padding:24px}
    main{width:min(92vw,520px);padding:28px 24px;border-radius:28px;text-align:center;border:1px solid rgba(255,220,145,.72);background:linear-gradient(165deg,rgba(49,20,76,.95),rgba(20,8,38,.96));box-shadow:0 24px 70px #08020f99,0 0 36px #ce6cff35}
    img{width:92px;height:92px;border-radius:24px;display:block;margin:0 auto 20px;box-shadow:0 0 28px #ff9fe877,0 10px 28px #08020f88}
    h1{margin:0;font-size:clamp(28px,7vw,42px);line-height:1.05;font-weight:900;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif}
    .en{display:block;background:linear-gradient(180deg,#fff9d8 0%,#ffd56e 42%,#ff9ee2 77%,#c5a0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5d2159) drop-shadow(0 0 12px #ff91da88)}
    .kana{display:block;margin-top:7px;font-size:.43em;letter-spacing:.09em;color:#ffe6a7;text-shadow:0 0 10px #ff8ed688}
    p{line-height:1.8;color:#fff3fb;margin:22px 0 0}
    ol{text-align:left;line-height:1.9;margin:18px auto 0;max-width:360px;color:#fff7ff}
    .note{font-size:13px;color:#e7d6eb;margin-top:20px}
  </style>
</head>
<body>
<main>
  <img src="/install-v23/piano-dream-stage-touch-v23.png" alt="">
  <h1><span class="en">Piano Dream Stage</span><span class="kana">ピアノドリームステージ</span></h1>
  <p>ホーム画面に追加してから起動してください。</p>
  <ol>
    <li>Safariの「共有」をタップ</li>
    <li>「ホーム画面に追加」をタップ</li>
    <li>右上の「追加」をタップ</li>
  </ol>
  <p class="note">追加したピアノのアイコンから起動すると、演奏画面へ移動します。</p>
</main>
<script>
  const installed = navigator.standalone === true ||
    window.matchMedia('(display-mode: standalone)').matches ||
    window.matchMedia('(display-mode: fullscreen)').matches;
  if (installed) location.replace('/?app=home');
</script>
</body>
</html>
