<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#241324">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ピアノドリームステージ">
  <script>
    window.__pdsInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      window.__pdsInstallPrompt = event;
      window.dispatchEvent(new Event('pds-install-prompt-ready'));
    });
  </script>
  <title>ピアノドリームステージ</title>
  <link rel="icon" type="image/png" href="https://piano-dream-stage.vercel.app/install/apple-touch-icon.png?v=1">
  <link rel="apple-touch-icon" sizes="180x180" href="https://piano-dream-stage.vercel.app/install/apple-touch-icon.png?v=1">
  <link rel="manifest" href="/manifest.webmanifest?v=28">
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Maru Gothic ProN",sans-serif;background:
      radial-gradient(circle at 50% -5%,rgba(255,121,224,.45),transparent 32%),
      radial-gradient(circle at 18% 28%,rgba(104,71,255,.4),transparent 28%),
      radial-gradient(circle at 86% 78%,rgba(255,190,94,.2),transparent 26%),
      linear-gradient(155deg,#120722 0%,#2b0b47 42%,#4b1261 66%,#16091f 100%);color:#fff}
    body{display:grid;place-items:center;min-height:100dvh;padding:24px}
    main{width:min(92vw,520px);padding:28px 24px;border-radius:28px;text-align:center;border:1px solid rgba(255,220,145,.72);background:linear-gradient(165deg,rgba(49,20,76,.95),rgba(20,8,38,.96));box-shadow:0 24px 70px #08020f99,0 0 36px #ce6cff35}
    img{width:92px;height:92px;border-radius:24px;display:block;margin:0 auto 20px;box-shadow:0 0 28px #ff9fe877,0 10px 28px #08020f88}
    h1{margin:0;font-size:clamp(28px,7vw,42px);line-height:1.05;font-weight:900;font-family:ui-rounded,"Hiragino Maru Gothic ProN","Arial Rounded MT Bold",system-ui,sans-serif}
    .en{display:block;background:linear-gradient(180deg,#fff9d8 0%,#ffd56e 42%,#ff9ee2 77%,#c5a0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #5d2159) drop-shadow(0 0 12px #ff91da88)}
    .kana{display:block;margin-top:7px;font-size:.43em;letter-spacing:.09em;color:#ffe6a7;text-shadow:0 0 10px #ff8ed688}
    p{line-height:1.8;color:#fff3fb;margin:22px 0 0}
    ol{text-align:left;line-height:1.9;margin:18px auto 0;max-width:360px;color:#fff7ff}
    .note{font-size:13px;color:#e7d6eb;margin-top:20px}
  </style>
</head>
<body>
<main>
  <img src="/install/apple-touch-icon.png?v=1" alt="">
  <h1><span class="en">Piano Dream Stage</span><span class="kana">ピアノドリームステージ</span></h1>
  <p>ホーム画面に追加してから起動してください。</p>
  <button id="android-install-button" type="button" hidden style="width:100%;min-height:52px;margin:18px 0 0;border:0;border-radius:26px;background:linear-gradient(180deg,#f6d887,#b8832e);color:#2f1734;font:700 16px system-ui,-apple-system,sans-serif">ホーム画面に追加</button>\n  <p id="android-install-help" class="note"></p>\n  <ol>
    <li>Safariの「共有」をタップ</li>
    <li>「ホーム画面に追加」をタップ</li>
    <li>右上の「追加」をタップ</li>
  </ol>
  <p class="note">ホーム画面から起動すると、演奏画面へ自動で移動します。</p>
</main>
<script>
  const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  if (isStandalone) {
    location.replace('/?app=home');
  } else {
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const button = document.getElementById('android-install-button');
    const help = document.getElementById('android-install-help');
    let promptEvent = window.__pdsInstallPrompt || null;

    if (!isIOS) {
      help.textContent = 'Chromeのインストール準備中です。ボタンが出ない場合は右上の「︙」→「アプリをインストール」または「ホーム画面に追加」を選んでください。';

      const syncPrompt = () => {
        promptEvent = window.__pdsInstallPrompt || promptEvent;
        button.hidden = !promptEvent;
        if (promptEvent) help.textContent = '下のボタンからドリステをインストールできます。';
      };

      button.addEventListener('click', async () => {
        if (!promptEvent) return;
        const current = promptEvent;
        promptEvent = null;
        window.__pdsInstallPrompt = null;
        button.hidden = true;
        try {
          await current.prompt();
          const choice = await current.userChoice;
          help.textContent = choice.outcome === 'accepted'
            ? 'インストール後、ホーム画面の「ドリステ」から起動してください。'
            : 'インストールをキャンセルしました。';
        } catch (_) {
          help.textContent = 'Chrome右上の「︙」→「アプリをインストール」を選んでください。';
        }
      });

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        window.__pdsInstallPrompt = event;
        promptEvent = event;
        syncPrompt();
      });
      window.addEventListener('pds-install-prompt-ready', syncPrompt);

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope:'/' })
          .then(() => navigator.serviceWorker.ready)
          .then(syncPrompt)
          .catch(() => {});
      }
      syncPrompt();
    }
  }
</script>
</body>
</html>
